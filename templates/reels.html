<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReelsX</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

.swiper{
    width:100%;
    height:100vh;
}

.swiper-slide{
    position:relative;
    width:100%;
    height:100vh;
    background:black;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:black;
}

.overlay{
    position:absolute;
    bottom:20px;
    left:15px;
    color:white;
    z-index:10;
    text-shadow:0 0 5px black;
}

.channel{
    font-size:18px;
    font-weight:bold;
}

.caption{
    font-size:14px;
    margin-top:5px;
}

#soundBtn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    font-size:24px;
    background:rgba(0,0,0,0.6);
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<button id="soundBtn">🔇</button>

<div class="swiper">
    <div class="swiper-wrapper">
        <!-- Videos will be loaded here dynamically -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>


const swiper = new Swiper(".swiper", {
    direction: "vertical",
    slidesPerView: 1,
    resistanceRatio: 0,
    speed: 300
});

let soundEnabled = false;

async function loadReels() {

    const res = await fetch("/api/videos");
    const videos = await res.json();

    const wrapper = document.querySelector(".swiper-wrapper");
    wrapper.innerHTML = "";

    videos.forEach(v => {

        const videoURL =
            `https://api.telegram.org/file/bot<8990620972:AAFyvhcDiDH_NI_nVmRBTZSWzF-Rrx0yRL0>/videos/${v.file_id}`;

        const slide = document.createElement("div");
        slide.className = "swiper-slide";

        slide.innerHTML = `
            <video autoplay muted loop playsinline controls>
                <source src="${videoURL}">
            </video>

            <div class="overlay">
                <div class="channel">@Reelsx60</div>
                <div class="caption">${v.caption}</div>
            </div>
        `;

        wrapper.appendChild(slide);
    });

    swiper.update();
    playActive();
}

function playActive() {

    document.querySelectorAll("video").forEach(v => v.pause());

    const active = swiper.slides[swiper.activeIndex]
        ?.querySelector("video");

    if(active){
        active.play().catch(()=>{});
    }
}

swiper.on("slideChange", playActive);

document.getElementById("soundBtn").onclick = () => {

    soundEnabled = !soundEnabled;

    const active = swiper.slides[swiper.activeIndex]
        ?.querySelector("video");

    if(active){
        active.muted = !soundEnabled;
    }

    document.getElementById("soundBtn").innerText =
        soundEnabled ? "🔊" : "🔇";
};

loadReels();

    
</script>

</body>
</html>
