<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ReelsX</title>

<style>
html,body{
    margin:0;
    padding:0;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    height:100%;
    background:black;
}

.reel{
    height:100vh;
    scroll-snap-align:start;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>
</head>

<body>

<div class="reel">
<video controls autoplay loop>
<source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>
</div>

<div class="reel">
<video controls loop>
<source src="https://www.w3schools.com/html/movie.mp4">
</video>
</div>

</body>
</html>
