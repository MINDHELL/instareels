<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReelsX</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

.swiper{
    width:100%;
    height:100vh;
}

.swiper-slide{
    position:relative;
    overflow:hidden;
    width:100%;
    height:100vh;
    background:black;
}

video{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    background:black;
}

.overlay{
    position:absolute;
    bottom:20px;
    left:15px;
    color:white;
    z-index:10;
    text-shadow:0 0 8px black;
}

.channel{
    font-size:18px;
    font-weight:bold;
}

.caption{
    font-size:14px;
    margin-top:5px;
}

#soundBtn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;

    width:50px;
    height:50px;

    border:none;
    border-radius:50%;

    font-size:24px;

    background:rgba(0,0,0,0.6);
    color:white;

    cursor:pointer;
}

.pause-indicator{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:70px;
    z-index:20;
    display:none;
    pointer-events:none;
    text-shadow:0 0 15px black;
}

</style>
</head>

<body>

<button id="soundBtn">🔇</button>

<div class="swiper">
    <div class="swiper-wrapper">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>

const swiper = new Swiper(".swiper", {
    direction:"vertical",
    slidesPerView:1,
    resistanceRatio:0,
    speed:300
});

let soundEnabled = false;
let currentVideos = [];

async function loadReels(force=false){

    const res =
        await fetch("/api/videos?t=" + Date.now());

    const videos = await res.json();

    if(
        !force &&
        JSON.stringify(videos)
        ===
        JSON.stringify(currentVideos)
    ){
        return;
    }

    currentVideos = videos;

    const wrapper =
    document.querySelector(".swiper-wrapper");

const currentIndex =
    swiper.activeIndex;

wrapper.innerHTML = "";

    videos.forEach(v=>{

        const slide =
            document.createElement("div");

        slide.className = "swiper-slide";

        slide.innerHTML = `

            <video
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
            >
                <source src="${v.url}">
            </video>

            <div class="pause-indicator">
                ⏸
            </div>

            <div class="overlay">
                <div class="channel">
                    @Reelsx60
                </div>

                <div class="caption">
                    ${v.caption || "Reel"}
                </div>
            </div>

        `;

        wrapper.appendChild(slide);
    });

    swiper.update();

swiper.slideTo(
    Math.min(
        currentIndex,
        videos.length - 1
    ),
    0
);

addVideoEvents();

detectVideoType();

playActive();

}

function detectVideoType(){

    document.querySelectorAll("video")
    .forEach(video=>{

        video.addEventListener(
            "loadedmetadata",
            ()=>{

                const ratio =
                    video.videoWidth /
                    video.videoHeight;

                if(ratio > 1){

                    video.style.objectFit =
                        "contain";

                }else{

                    video.style.objectFit =
                        "cover";
                }

            }
        );

    });

}

function preloadNextVideos(){

    const next1 =
        swiper.slides[
            swiper.activeIndex + 1
        ]?.querySelector("video");

    const next2 =
        swiper.slides[
            swiper.activeIndex + 2
        ]?.querySelector("video");

    if(next1){
    next1.preload = "metadata";
}

if(next2){
    next2.preload = "metadata";
    }
    }
function playActive(){

    document.querySelectorAll("video")
    .forEach(v => {

        v.pause();

        v.currentTime = v.currentTime;

        v.muted = true;
    });

    const activeVideo =
        swiper.slides[
            swiper.activeIndex
        ]?.querySelector("video");

    if(activeVideo){

        activeVideo.muted =
            !soundEnabled;

        activeVideo.play()
        .catch(()=>{});
    }

    preloadNextVideos();
}

swiper.on(
    "slideChange",
    playActive
);

function addVideoEvents(){

    document.querySelectorAll("video")
    .forEach(video=>{

        video.addEventListener(
            "click",
            ()=>{

                const indicator =
                    video.parentElement
                    .querySelector(
                        ".pause-indicator"
                    );

                if(video.paused){

                    video.play();

                    indicator.style.display =
                        "none";

                }else{

                    video.pause();

                    indicator.style.display =
                        "block";
                }

            }
        );

    });

}

document
.getElementById("soundBtn")
.onclick = ()=>{

    soundEnabled =
        !soundEnabled;

    document
    .querySelectorAll("video")
    .forEach(v=>{

        v.muted =
            !soundEnabled;

    });

    document
    .getElementById("soundBtn")
    .innerText =
        soundEnabled
        ? "🔊"
        : "🔇";
};

loadReels(true);

/* check for new reels every 30 sec */
setInterval(()=>{

    loadReels();

},30000);

</script>

</body>
</html>
